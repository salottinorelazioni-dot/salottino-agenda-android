name: Genera APK Salottino Agenda

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai progetto Android
        run: unzip -o salottino-agenda-android-github-ready.zip -d .

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compila APK
        run: gradle :app:assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: Salottino-Agenda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
